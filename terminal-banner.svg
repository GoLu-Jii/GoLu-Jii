<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; font-weight: 500; }
    .code { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 15px; }
    .green { fill: #3fb950; font-weight: 600; }
    .blue { fill: #58a6ff; font-weight: 600; }
    .white { fill: #c9d1d9; }
    .gray { fill: #8b949e; }
    .brand { font-size: 48px; font-weight: 800; fill: #3fb950; letter-spacing: 1.5px; }
    .footer { font-size: 12px; fill: #484f58; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { fill: #3fb950; animation: blink 1s infinite; }
  </style>

  <!-- Terminal Background forced to sharp rx=0 to kill white corner bleed -->
  <rect x="0" y="0" width="800" height="500" rx="0" fill="#0d1117" />

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56" />
  <circle cx="44" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="22" r="6" fill="#27c93f" />
  
  <!-- Title Bar -->
  <text x="400" y="26" text-anchor="middle" class="title">golu-jii@arch: zsh</text>

  <!-- Terminal Body -->
  <g class="code">
    <!-- whoami -->
    <text x="35" y="75"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">whoami</tspan></text>
    <text x="35" y="100" class="blue">gaurav-joshi</text>

    <!-- ROLE -->
    <text x="35" y="140"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">echo $ROLE</tspan></text>
    <text x="35" y="165" class="gray">ai/ml engineer | full-stack builder</text>

    <!-- STACK -->
    <text x="35" y="205"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">echo $STACK</tspan></text>
    <text x="35" y="230" class="gray">rag | fastapi | groq | react</text>

    <!-- STATUS -->
    <text x="35" y="270"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">echo $STATUS</tspan></text>
    <text x="35" y="295" class="gray">building before the degree ends</text>

    <!-- Live Prompt Buffer -->
    <text x="35" y="335"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="cursor">█</tspan></text>
    
    <!-- Giant Output -->
    <text x="35" y="415" class="brand">GAURAV JOSHI</text>

    <!-- Sub-footer (Dots also swapped for pipes) -->
    <text x="35" y="465" class="footer">b.tech cse (ai/ml) @ gehu | groq + fastapi + rag | bhimtal, india</text>
  </g>
</svg>
