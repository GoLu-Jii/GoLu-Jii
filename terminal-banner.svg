<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; font-weight: 500; }
    .code { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 15px; }
    .green { fill: #3fb950; font-weight: 600; }
    .blue { fill: #58a6ff; font-weight: 600; }
    .white { fill: #c9d1d9; }
    .gray { fill: #8b949e; }
    .brand { font-size: 48px; font-weight: 800; fill: #3fb950; letter-spacing: 1.5px; }
    .footer { font-size: 12px; fill: #484f58; }
    
    /* Choreography System */
    .pop { opacity: 0; animation: popIn 0.01s forwards; }
    @keyframes popIn { to { opacity: 1; } }

    .fade { opacity: 0; animation: fadeIn 0.8s ease-out forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; }

    /* Shutter Typing Keyframes */
    .s1 { animation: type1 0.35s linear 0.5s both; }
    .s2 { animation: type2 0.45s linear 1.5s both; }
    .s3 { animation: type3 0.5s linear 2.6s both; }
    .s4 { animation: type4 0.55s linear 3.75s both; }

    @keyframes type1 { 0% { transform: translateX(0); opacity: 0; } 1% { transform: translateX(0); opacity: 1; } 95% { transform: translateX(65px); opacity: 1; } 100% { transform: translateX(65px); opacity: 0; } }
    @keyframes type2 { 0% { transform: translateX(0); opacity: 0; } 1% { transform: translateX(0); opacity: 1; } 95% { transform: translateX(100px); opacity: 1; } 100% { transform: translateX(100px); opacity: 0; } }
    @keyframes type3 { 0% { transform: translateX(0); opacity: 0; } 1% { transform: translateX(0); opacity: 1; } 95% { transform: translateX(110px); opacity: 1; } 100% { transform: translateX(110px); opacity: 0; } }
    @keyframes type4 { 0% { transform: translateX(0); opacity: 0; } 1% { transform: translateX(0); opacity: 1; } 95% { transform: translateX(120px); opacity: 1; } 100% { transform: translateX(120px); opacity: 0; } }
  </style>

  <rect x="0" y="0" width="800" height="500" rx="0" fill="#0d1117" />

  <circle cx="24" cy="22" r="6" fill="#ff5f56" />
  <circle cx="44" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="22" r="6" fill="#27c93f" />
  <text x="400" y="26" text-anchor="middle" class="title">golu-jii@arch: zsh</text>

  <g class="code">
    <text x="35" y="75"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">whoami</tspan></text>
    <g class="s1">
      <rect x="190" y="59" width="9" height="18" fill="#3fb950" />
      <rect x="199" y="58" width="250" height="22" fill="#0d1117" />
    </g>
    <text x="35" y="100" class="blue pop" style="animation-delay: 0.9s;">gaurav-joshi</text>


    <text x="35" y="140" class="pop" style="animation-delay: 1.3s;"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">echo $ROLE</tspan></text>
    <g class="s2">
      <rect x="190" y="124" width="9" height="18" fill="#3fb950" />
      <rect x="199" y="123" width="250" height="22" fill="#0d1117" />
    </g>
    <text x="35" y="165" class="gray pop" style="animation-delay: 2.0s;">ai/ml engineer | full-stack builder</text>


    <text x="35" y="205" class="pop" style="animation-delay: 2.4s;"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">echo $STACK</tspan></text>
    <g class="s3">
      <rect x="190" y="189" width="9" height="18" fill="#3fb950" />
      <rect x="199" y="188" width="250" height="22" fill="#0d1117" />
    </g>
    <text x="35" y="230" class="gray pop" style="animation-delay: 3.15s;">rag | fastapi | groq | react</text>


    <text x="35" y="270" class="pop" style="animation-delay: 3.55s;"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="white">echo $STATUS</tspan></text>
    <g class="s4">
      <rect x="190" y="254" width="9" height="18" fill="#3fb950" />
      <rect x="199" y="253" width="250" height="22" fill="#0d1117" />
    </g>
    <text x="35" y="295" class="gray pop" style="animation-delay: 4.35s;">building before the degree ends</text>


    <text x="35" y="335" class="pop" style="animation-delay: 4.75s;"><tspan class="green">golu-jii@arch ~ % </tspan><tspan class="green cursor">█</tspan></text>
    

    <text x="35" y="415" class="brand fade" style="animation-delay: 5.3s;">GAURAV JOSHI</text>
    <text x="35" y="465" class="footer fade" style="animation-delay: 5.3s;">b.tech cse (ai/ml) @ gehu | groq + fastapi + rag | bhimtal, india</text>
  </g>
</svg>
