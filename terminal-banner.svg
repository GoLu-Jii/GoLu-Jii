<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gaurav Joshi terminal banner</title>
<desc>Terminal-style GitHub profile banner for Gaurav Joshi, AI/ML engineer and full-stack builder</desc>

<style>
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes type1 { from{width:0} to{width:148px} }
@keyframes type2 { from{width:0} to{width:104px} }
@keyframes type3 { from{width:0} to{width:272px} }
@keyframes type4 { from{width:0} to{width:232px} }
@keyframes type5 { from{width:0} to{width:208px} }
@keyframes fadein { from{opacity:0} to{opacity:1} }
</style>

<defs>
  <clipPath id="c1"><rect x="170" y="55" width="148" height="18"/></clipPath>
  <clipPath id="c2"><rect x="170" y="107" width="104" height="18"/></clipPath>
  <clipPath id="c3"><rect x="30" y="136" width="272" height="18"/></clipPath>
  <clipPath id="c4"><rect x="170" y="159" width="232" height="18"/></clipPath>
  <clipPath id="c5"><rect x="30" y="184" width="208" height="18"/></clipPath>
</defs>

<!-- Window chrome -->
<rect x="0" y="0" width="680" height="400" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="0" width="680" height="34" rx="10" fill="#161b22"/>
<rect x="0" y="24" width="680" height="10" fill="#161b22"/>
<circle cx="26" cy="17" r="6" fill="#ff5f56"/>
<circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="66" cy="17" r="6" fill="#27c93f"/>
<text x="340" y="21" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e">golu-jii@arch: zsh</text>

<!-- whoami -->
<text x="30" y="68" font-family="monospace" font-size="14" fill="#3fb950">golu-jii@arch ~ %</text>
<g clip-path="url(#c1)">
  <text x="170" y="68" font-family="monospace" font-size="14" fill="#c9d1d9" style="animation:type1 0.5s steps(12,end) 0.3s both;">whoami</text>
</g>
<text x="30" y="92" font-family="monospace" font-size="14" fill="#58a6ff" style="animation:fadein 0s 0.85s both;opacity:0">gaurav-joshi</text>

<!-- echo $ROLE -->
<text x="30" y="116" font-family="monospace" font-size="14" fill="#3fb950" style="animation:fadein 0s 1.2s both;opacity:0">golu-jii@arch ~ %</text>
<g clip-path="url(#c2)">
  <text x="170" y="116" font-family="monospace" font-size="14" fill="#c9d1d9" style="animation:type2 0.5s steps(11,end) 1.2s both;">echo $ROLE</text>
</g>
<g clip-path="url(#c3)">
  <text x="30" y="140" font-family="monospace" font-size="13.5" fill="#8b949e" style="animation:type3 0.6s steps(22,end) 1.8s both;">ai/ml engineer · full-stack builder</text>
</g>

<!-- echo $STACK -->
<text x="30" y="164" font-family="monospace" font-size="14" fill="#3fb950" style="animation:fadein 0s 2.6s both;opacity:0">golu-jii@arch ~ %</text>
<g clip-path="url(#c4)">
  <text x="170" y="164" font-family="monospace" font-size="14" fill="#c9d1d9" style="animation:type4 0.6s steps(20,end) 2.6s both;">echo $STACK</text>
</g>
<g clip-path="url(#c5)">
  <text x="30" y="188" font-family="monospace" font-size="13.5" fill="#8b949e" style="animation:type5 0.6s steps(18,end) 3.4s both;">rag · fastapi · groq · react</text>
</g>

<!-- echo $STATUS -->
<text x="30" y="212" font-family="monospace" font-size="14" fill="#3fb950" style="animation:fadein 0s 4.2s both;opacity:0">golu-jii@arch ~ %</text>
<text x="170" y="212" font-family="monospace" font-size="14" fill="#c9d1d9" style="animation:fadein 0s 4.2s both;opacity:0">echo $STATUS</text>
<text x="30" y="236" font-family="monospace" font-size="13.5" fill="#8b949e" style="animation:fadein 0s 4.9s both;opacity:0">building before the degree ends</text>

<!-- Blinking cursor -->
<text x="30" y="260" font-family="monospace" font-size="14" fill="#3fb950" style="animation:fadein 0s 5.4s both;opacity:0">golu-jii@arch ~ %</text>
<rect x="170" y="248" width="9" height="16" fill="#3fb950" style="animation:fadein 0s 5.4s both,blink 1s step-end 5.4s infinite;opacity:0"/>

<!-- Name -->
<text x="30" y="330" font-family="monospace" font-weight="700" font-size="52" fill="#3fb950" style="animation:fadein 0.4s ease 5.8s both;opacity:0">GAURAV JOSHI</text>

<!-- Footer -->
<text x="30" y="384" font-family="monospace" font-size="11.5" fill="#484f58" style="animation:fadein 0.4s ease 6.2s both;opacity:0">b.tech cse (ai/ml) @ gehu  ·  groq + fastapi + rag  ·  bhimtal, india</text>
</svg>
