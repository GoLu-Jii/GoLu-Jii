<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%" role="img" aria-label="Gaurav Joshi terminal boot">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .pr  { fill: #3fb950; font-weight: 600; }
    .cmd { fill: #c9d1d9; font-weight: 600; }
    .blu { fill: #58a6ff; font-weight: 600; }
    .gry { fill: #8b949e; }
    .big { font-size: 52px; font-weight: 800; fill: #3fb950; letter-spacing: 1.5px; }
  </style>

  <defs>
    <clipPath id="c1"><rect x="34" y="65" width="0" height="26"><animate attributeName="width" from="0" to="280" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="34" y="95" width="0" height="26"><animate attributeName="width" from="0" to="140" begin="1.0s" dur="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="34" y="135" width="0" height="26"><animate attributeName="width" from="0" to="320" begin="1.5s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="34" y="165" width="0" height="26"><animate attributeName="width" from="0" to="370" begin="2.1s" dur="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="34" y="205" width="0" height="26"><animate attributeName="width" from="0" to="330" begin="2.7s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="34" y="235" width="0" height="26"><animate attributeName="width" from="0" to="300" begin="3.3s" dur="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="34" y="275" width="0" height="26"><animate attributeName="width" from="0" to="340" begin="3.9s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="34" y="305" width="0" height="26"><animate attributeName="width" from="0" to="330" begin="4.5s" dur="0.3s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0" y="0" width="840" height="520" rx="0" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="0" y="0" width="840" height="38" fill="#161b22" />
  <line x1="0" y1="38" x2="840" y2="38" stroke="#21262d" stroke-width="1"/>

  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="420" y="24" text-anchor="middle" class="gry" font-size="13">golu-jii@arch: zsh</text>

  <g clip-path="url(#c1)"><text x="34" y="85" font-size="16"><tspan class="pr">golu-jii@arch ~ %</tspan><tspan class="cmd"> whoami</tspan></text></g>
  <g clip-path="url(#c2)"><text x="34" y="115" font-size="16" class="blu">gaurav-joshi</text></g>

  <g clip-path="url(#c3)"><text x="34" y="155" font-size="16"><tspan class="pr">golu-jii@arch ~ %</tspan><tspan class="cmd"> echo $ROLE</tspan></text></g>
  <g clip-path="url(#c4)"><text x="34" y="185" font-size="16" class="gry">ai/ml engineer | full-stack builder</text></g>

  <g clip-path="url(#c5)"><text x="34" y="225" font-size="16"><tspan class="pr">golu-jii@arch ~ %</tspan><tspan class="cmd"> echo $STACK</tspan></text></g>
  <g clip-path="url(#c6)"><text x="34" y="255" font-size="16" class="gry">rag | fastapi | groq | react</text></g>

  <g clip-path="url(#c7)"><text x="34" y="295" font-size="16"><tspan class="pr">golu-jii@arch ~ %</tspan><tspan class="cmd"> echo $STATUS</tspan></text></g>
  <g clip-path="url(#c8)"><text x="34" y="325" font-size="16" class="gry">building before the degree ends</text></g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.1s" dur="0.7s" fill="freeze"/>
    <text x="32" y="415" class="big">GAURAV JOSHI</text>
    <text x="34" y="455" font-size="13" class="gry">b.tech cse (ai/ml) @ gehu | groq + fastapi + rag | bhimtal, india</text>
    
    <text x="34" y="495" font-size="16"><tspan class="pr">golu-jii@arch ~ %</tspan></text>
    <rect x="208" y="480" width="10" height="18" fill="#3fb950">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="5.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
